<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Integration Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Главный заголовок страницы -->
  <h1>Консультант по языкам программирования</h1>
  
  <!-- Поле ввода для вопросов пользователя -->
  <textarea id="user-input" placeholder="Ваш вопрос..."></textarea>
  
  <!-- Кнопка для отправки вопроса -->
  <button id="send-btn">Отправить</button>
  
  <!-- Контейнер для отображения ответа от AI -->
  <div id="response"></div>
  
  <!-- Подключение JavaScript файла -->
  <script src="script.js"></script>
</body>
</html>
